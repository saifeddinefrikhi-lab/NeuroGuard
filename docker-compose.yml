services:
  mysql:
    image: mysql:8.0
    container_name: neuroguard-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:6.0
    container_name: neuroguard-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: neuroguard-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: neuroguard-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      - mysql

  eureka-server:
    build:
      context: ./neuroguard-backend/eureka-server
    container_name: neuroguard-eureka
    ports:
      - "8761:8761"

  config-server:
    build:
      context: ./neuroguard-backend/config-server
    container_name: neuroguard-config
    environment:
      SPRING_PROFILES_ACTIVE: native
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      - eureka-server

  user-service:
    build:
      context: ./neuroguard-backend/user-service
    container_name: neuroguard-user
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/neuroguard
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/neuroguard/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/userdb?createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_started
      config-server:
        condition: service_started

  medical-history-service:
    build:
      context: ./neuroguard-backend/medical-history-service
    container_name: neuroguard-medical-history
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/neuroguard
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/neuroguard/protocol/openid-connect/certs
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/medical_history_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      USER_SERVICE_URL: http://user-service:8081
      ALERT_SERVICE_URL: http://risk-alert-service:8084
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      AZURE_STORAGE_ENABLED: "false"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_started
      config-server:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  risk-alert-service:
    build:
      context: ./neuroguard-backend/risk-alert-service
    container_name: neuroguard-risk-alert
    restart: unless-stopped
    environment:
      PORT: 8084
      SERVICE_HOST: 0.0.0.0
      EUREKA_INSTANCE_HOSTNAME: risk-alert-service
      EUREKA_ENABLED: "true"
      EUREKA_HOST: eureka-server
      EUREKA_PORT: 8761
      MEDICAL_HISTORY_SERVICE_URL: http://medical-history-service:8082
      MONGODB_URI: mongodb://mongodb:27017/risk-alert-db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - "8084:8084"
    depends_on:
      eureka-server:
        condition: service_started
      medical-history-service:
        condition: service_started
      mongodb:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  gateway:
    build:
      context: ./neuroguard-backend/gateway
    container_name: neuroguard-gateway
    restart: unless-stopped
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/neuroguard
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/neuroguard/protocol/openid-connect/certs
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
    ports:
      - "8083:8083"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_started
      keycloak:
        condition: service_started
      user-service:
        condition: service_started
      medical-history-service:
        condition: service_started
      risk-alert-service:
        condition: service_started

  frontend:
    build:
      context: ./FrontEnd
    container_name: neuroguard-frontend
    ports:
      - "4200:80"
    depends_on:
      - gateway
      - keycloak

volumes:
  mysql-data:
  mongodb-data: